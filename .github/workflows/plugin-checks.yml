name: Plugin checks

on:
  pull_request:
  push:
    branches:
      - fix/isolated-utility-completions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build plugin
        run: npm run build

  openclaw-2026-11-6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Install OpenClaw 2026.11.6 SDK for compatibility testing
        run: npm install --no-save --package-lock=false openclaw@2026.11.6
      - name: Typecheck with OpenClaw 2026.11.6
        run: npx tsc --noEmit
      - name: Run tests with OpenClaw 2026.11.6
        run: npm test
